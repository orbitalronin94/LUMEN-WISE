name: LUMEN-WISE — code and regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lumen-wise-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest pyarrow
      - name: Compile model and training code
        run: python -m compileall -q model train eval scripts
      - name: Verify parameter counts and x5 architecture
        run: PYTHONPATH=. python scripts/validate_lumen_wise_x5.py
      - name: Run migrated regression tests
        run: PYTHONPATH=. pytest -q tests
