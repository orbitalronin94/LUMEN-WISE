name: LUMEN-WISE — first paired x5 training (1000 steps)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/first-paired-x5-1000.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-wise-first-paired-x5-1000
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"
  SOURCE_REPOSITORY: "orbitalronin94/WISE-RONIN"
  SOURCE_ARTIFACT_ID: "15024245779"
  SOURCE_ARTIFACT_SHA256: "f8d136abae6a1312d9f2ce49efb1418e7a11c49e0dccd64837e152f5f4c6cd27"
  SOURCE_RUN_ID: "45618840019"
  TOKENIZER_SHA256: "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"

jobs:
  prepare-v4-inputs:
    name: Import and verify frozen V4 corpus
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Download the frozen V4 artifact from WISE-RONIN
        shell: bash
        env:
          WISE_RONIN_READ_TOKEN: ${{ secrets.WISE_RONIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WISE_RONIN_READ_TOKEN:-}" ]; then
            echo "::error::Missing repository secret WISE_RONIN_READ_TOKEN (fine-grained token with Actions: read on WISE-RONIN)."
            exit 2
          fi
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WISE_RONIN_READ_TOKEN}" \
            "https://api.github.com/repos/${SOURCE_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output corpus-v4.zip
          echo "${SOURCE_ARTIFACT_SHA256}  corpus-v4.zip" | sha256sum --check
          mkdir corpus
          unzip -q corpus-v4.zip -d corpus
          test -s corpus/manifest.json
          test -s corpus/tokenizer.json

      - name: Verify frozen V4 authorization, tokenizer and all shard hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path("corpus")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected_tokenizer = "${{ env.TOKENIZER_SHA256 }}"
          assert manifest.get("version") == "v4.0.0", manifest.get("version")
          assert manifest.get("status") == "FROZEN_TRAINABLE", manifest.get("status")
          assert manifest.get("training_authorized") is True
          assert manifest.get("tokenizer_sha256") == expected_tokenizer
          assert hashlib.sha256((root / "tokenizer.json").read_bytes()).hexdigest() == expected_tokenizer
          shards = manifest.get("shards", [])
          assert len(shards) == 24, len(shards)
          total_rows = 0
          for shard in shards:
              path = root / shard["file"]
              assert path.is_file() and path.stat().st_size == int(shard["bytes"]), shard["file"]
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              assert digest.hexdigest() == shard["sha256"], shard["file"]
              total_rows += int(shard["rows"])
          assert total_rows == int(manifest["total_rows"]) == 2_293_883, total_rows
          print(f"FROZEN_V4_OK run=${{env.SOURCE_RUN_ID}} rows={total_rows} shards={len(shards)} tokenizer={expected_tokenizer}")
          PY

      - name: Publish verified V4 inputs for both independent model jobs
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wise-v4-inputs-${{ github.run_id }}
          path: corpus/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  train-lumen-x5:
    name: Train LUMEN x5 — steps 0 to 1000
    needs: prepare-v4-inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: lumen-wise-v4-inputs-${{ github.run_id }}
          path: corpus

      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "tokenizers>=0.20,<1.0" "tqdm>=4.66,<5"

      - name: Verify input lineage and write the exact 1000-step model config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("corpus")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = "${{ env.TOKENIZER_SHA256 }}"
          assert manifest["training_authorized"] is True
          assert manifest["status"] == "FROZEN_TRAINABLE"
          assert manifest["tokenizer_sha256"] == expected
          assert hashlib.sha256((root / "tokenizer.json").read_bytes()).hexdigest() == expected
          assert len(manifest["shards"]) == 24
          config = json.loads(Path("config/lumen_wise_x5.json").read_text(encoding="utf-8"))
          config.update({
              "learning_rate": 3e-5,
              "warmup_steps": 100,
              "batch_size": 8,
              "sequence_length": 128,
              "total_steps": 1000,
              "seed": 42
          })
          Path("config/lumen_wise_x5_train1000.json").write_text(
              json.dumps(config, indent=2) + "\n", encoding="utf-8"
          )
          print("LUMEN_CONFIG_OK steps=1000 lr=3e-5 warmup=100 batch=8 seq=128 seed=42")
          PY
          mkdir -p checkpoints/lumen logs
          { date -u; nproc; free -h; df -h .; } | tee logs/runner-baseline.txt
          python -m train.train --help >/dev/null

      - name: Train LUMEN x5 for 1000 real-corpus steps
        shell: bash
        run: |
          set -euo pipefail
          python -m train.train \
            --steps 1000 --log-every 1 --checkpoint-every 1000 \
            --recovery-checkpoint-every 100 --parameter-check-every 100 \
            --threads 4 --interop-threads 2 \
            --data corpus --tokenizer corpus/tokenizer.json \
            --batch 8 --max-len 128 --seed 42 \
            --lr 3e-5 --warmup 100 --total-steps 1000 \
            --ckpt-dir checkpoints/lumen --phase 1 --pilot-all-rows --v32-ze \
            --model-config config/lumen_wise_x5_train1000.json \
            --runtime-profile config/lumen_cpu_profile.json \
            --lazy-backward --surprise-gate-loss 1.8 \
            2>&1 | tee logs/lumen.log

      - name: Verify exact LUMEN x5 step-1000 checkpoint
        run: |
          python - <<'PY'
          import torch
          state = torch.load("checkpoints/lumen/step_1000.pt", map_location="cpu", weights_only=False)
          assert int(state["step"]) == 1000
          assert int(state["params"]) == 12_022_016
          assert state["architecture_id"] == "ronin_lumen_v3_3_neuroplasticity"
          assert state["v32_ze"] is True and state["pilot_all_rows"] is True
          assert int(state["seed"]) == 42
          assert int(state["training_config"]["total_steps"]) == 1000
          assert int(state["training_config"]["batch"]) == 8
          assert int(state["training_config"]["max_len"]) == 128
          assert abs(float(state["training_config"]["lr"]) - 3e-5) < 1e-12
          assert state["tokenizer_sha256"] == "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert all(state.get(key) is not None for key in ("model", "optimizer", "scheduler", "rng", "data_sha256"))
          print("LUMEN_X5_STEP1000_CHECKPOINT_OK params=12022016")
          PY

      - name: Upload LUMEN checkpoint, recovery state and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wise-x5-step1000-${{ github.run_id }}
          path: |
            checkpoints/lumen/
            logs/
            config/lumen_wise_x5_train1000.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  train-transformer-x5:
    name: Train Transformer x5 — steps 0 to 1000
    needs: prepare-v4-inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: lumen-wise-v4-inputs-${{ github.run_id }}
          path: corpus

      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "tokenizers>=0.20,<1.0" "tqdm>=4.66,<5"

      - name: Verify input lineage and prepare isolated checkpoint directory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("corpus")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = "${{ env.TOKENIZER_SHA256 }}"
          assert manifest["training_authorized"] is True
          assert manifest["status"] == "FROZEN_TRAINABLE"
          assert manifest["tokenizer_sha256"] == expected
          assert hashlib.sha256((root / "tokenizer.json").read_bytes()).hexdigest() == expected
          assert len(manifest["shards"]) == 24
          print("TRANSFORMER_INPUT_LINEAGE_OK rows=2293883 shards=24")
          PY
          mkdir -p checkpoints/transformer logs
          { date -u; nproc; free -h; df -h .; } | tee logs/runner-baseline.txt
          python -m train.transformer_baseline --help >/dev/null

      - name: Train Transformer x5 for 1000 real-corpus steps
        shell: bash
        run: |
          set -euo pipefail
          python -m train.transformer_baseline --steps 1000 \
            --data corpus --tokenizer corpus/tokenizer.json \
            --batch 8 --max-len 128 --seed 42 --threads 4 --interop-threads 2 \
            --disable-mkldnn --disable-foreach --cpu-affinity \
            --lr 3e-5 --warmup 100 --total-steps 1000 \
            --checkpoint-every 1000 --parameter-check-every 100 \
            --ckpt-dir checkpoints/transformer \
            --model-dim 488 --heads 8 --ff-width 1569 --residual-groups 51 \
            2>&1 | tee logs/transformer.log

      - name: Verify exact Transformer x5 step-1000 checkpoint
        run: |
          python - <<'PY'
          import torch
          state = torch.load("checkpoints/transformer/step_1000.pt", map_location="cpu", weights_only=False)
          assert int(state["step"]) == 1000 and int(state["params"]) == 12_022_016
          assert state["architecture_id"] == "decoder_transformer_4l_d488_h8_ff1569_rg51_tied_v2"
          assert state["model_spec"] == {
              "model_dim": 488, "heads": 8, "ff_width": 1569,
              "residual_groups": 51, "layers": 4, "tied_embeddings": True
          }
          assert int(state["seed"]) == 42
          assert int(state["training_config"]["total_steps"]) == 1000
          assert int(state["training_config"]["batch"]) == 8
          assert int(state["training_config"]["max_len"]) == 128
          assert abs(float(state["training_config"]["lr"]) - 3e-5) < 1e-12
          assert state["tokenizer_sha256"] == "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert all(state.get(key) is not None for key in ("model", "optimizer", "scheduler", "rng", "data_sha256"))
          print("TRANSFORMER_X5_STEP1000_CHECKPOINT_OK params=12022016")
          PY

      - name: Upload Transformer checkpoint and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wise-transformer-x5-step1000-${{ github.run_id }}
          path: |
            checkpoints/transformer/
            logs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1
